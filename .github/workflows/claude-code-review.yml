name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the @base/* package workspace.
            Focus on:
            - Correctness bugs and API contract breaks (treat @base/engine-core
              interface changes as breaking changes)
            - Package boundary violations (packages must not reach into consumer
              projects; peerDeps for pinia; no test files in published builds)
            - Missing or misleading types on exported APIs
            Report only findings you are confident in, with file:line references.

            You MUST post the review to the PR — do not leave it in your final
            message only. Post one top-level summary comment via
            `gh pr comment` and use inline comments
            (mcp__github_inline_comment__create_inline_comment) only for
            code-anchored findings. If the diff is clean, post a one-line
            all-clear comment.
          # Read/Grep/Glob are REQUIRED: --allowedTools *replaces* the default
          # allowlist rather than extending it, so without them the reviewer can
          # only see `gh pr diff` output and cannot open a single file. On a large
          # diff it burns the run on denied reads and exits green having posted
          # nothing (PR #43, 2026-08-30: 38 of 39 turns were permission denials,
          # $1.95, zero comments, check still SUCCESS).
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"'
